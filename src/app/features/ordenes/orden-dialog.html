<h2 mat-dialog-title>
  {{ data.mode === 'create' ? 'Nueva orden' : 'Editar orden' }}
</h2>

<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">

    <!-- Mesa -->
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Mesa</mat-label>

      <mat-select formControlName="id_mesa">
        <mat-option
          *ngFor="let mesa of mesas$ | async"
          [value]="mesa.id_mesa"
        >
          {{ mesa.numero_mesa }}
        </mat-option>
      </mat-select>
      
    </mat-form-field>

    <!-- Estado -->
     <mat-form-field appearance="outline" class="span-2">
      <mat-label>Estado</mat-label>

      <mat-select formControlName="estado">
        <mat-option value="pendiente">
          Pendiente
        </mat-option>

        <mat-option value="preparando">
          Preparando
        </mat-option>

        <mat-option value="listo">
          Listo
        </mat-option>

        <mat-option value="entregado">
          Entregado
        </mat-option>

        <mat-option value="cerrada">
          Cerrada
        </mat-option>
      </mat-select>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    Cancelar
  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid"
  >
    Guardar
  </button>
</mat-dialog-actions>
